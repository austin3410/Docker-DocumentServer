services:
  onlyoffice-documentserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: onlyoffice/documentserver:${TAG:-latest}
    container_name: onlyoffice-documentserver
    # Uncomment to enable JWT validation:
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${JWT_SECRET}
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
      - WOPI_ENABLED=true
      - IP_FILTER_RULES='allow ${NEXTCLOUD_HOST}; deny all'
    ports:
      - '${HTTP_PORT}:80'
      - '${HTTPS_PORT}:443'
    stdin_open: true
    restart: always
    stop_grace_period: 60s
    volumes:
       - ${BASE_PATH}/${DATA_PATH}:/var/www/onlyoffice/Data
       - ${BASE_PATH}/${LOG_PATH}:/var/log/onlyoffice
       - ${BASE_PATH}/${CACHE_PATH}:/var/lib/onlyoffice/documentserver/App_Data/cache/files
       - ${BASE_PATH}/${FILES_PATH}:/var/www/onlyoffice/documentserver-example/public/files
       - ${BASE_PATH}/${FONTS_PATH}:/usr/share/fonts
